<title>VOIDLIGHT — Neon Arena Survival</title>
<style>

</style>
</head>

<canvas id="game" aria-label="VOIDLIGHT: a neon arena survival game. Move with WASD, aim with the mouse, hold click to fire, dash with Shift. Survive all ten waves."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
